<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse;

            

        }

        td{
            border: 4px solid pink;
            padding: 9px;
            box-shadow:  2px 2px 3px black;
            text-align: center;
           
        }

        tr.linha{
            background-color: blanchedalmond;
        }

        td.dados{
            background-color: blue;
            color:white;
        } 
    </style>
</head>
<body>
    <h1>Minha Primeira Tabela</h1>
    <table>
        <tr class="linha">
            <td>A1</td>
            <td>A1</td>
            <td>A1</td>

        </tr>
        <tr>
            <td class="dados">A2</td>
            <td>B2</td>
            <td>C2</td>

        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
        <tr>
            <td>A5</td>
            <td>B5</td>
        </tr>
    </table>
</body>
</html>
