<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 300px;
        }

        td{
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }

        td.col{
            background-color: rgb(204, 204, 114);
        }
    </style>
</head>
<body>
    <h1>Mesclagem de células</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2" class="col">B</td>
        
        </tr>
        <tr>
            <td rowspan="2">D</td>
            <td>E</td>
            <td rowspan="3">F</td>
        </tr>
        <tr>

            <td>H</td>
       
        </tr>
        <tr>
            <td colspan="2" class="col">J</td>
            
     
        </tr>
        <tr>
            <td colspan="2">N</td>
        
            <td>P</td>
        </tr>
    </table>
</body>
</html>
