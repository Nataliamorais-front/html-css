<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgba(137, 43, 226, 0.541);
        }

        .box{
            position: absolute;
            width: 250px;
            height: 120px;
            background-color: orange;
            border-radius: 10px;
            box-shadow: 1px 2px 4px whitesmoke;

            top:0;
            left: 0;

            transform: translate(30px, 30px);

        }

        .container{
            position: absolute;
            background-color: blue;
            width: 250px;
            height: 120px;
            border-radius: 10px;
            box-shadow: 1px 2px 4px whitesmoke;

            right: 0;
            top:0;

            transform: translate(-35px, 30px);
        }

        p{
            padding: 10px;
            color:white;
            text-align: center;
            font-size: 1.5em;
            line-height: 4em;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>Promoção Ativa!!</p>

    </div>

    <div class="container">
        <h3>caixa no canto superior direito</h3>

    </div>
</body>
</html>
