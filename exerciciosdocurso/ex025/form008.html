<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario com Select, textare, datalist </title>
</head>
<body>
     <form action="cadastro.php" method="post">
        <p>
            <label for="estado">Estados:</label>
            <select name="estado" id="estado">
                <optgrou>
                    <option value="" selected >---Escolha---</option>
                    <optgroup label="Região Sudeste">
                        <option value="MG">Minas Gerais</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                    </optgroup>
                    <optgroup label="Região Sul">
                        <option value="SC">Santa Catarina</option>
                        <option value="PR">Paraná</option>
                        <option value="RS"> Rio Grande do Sul</option>
                    </optgroup>
                </select>
        </p>

            <p>
                <label for="Lista">Profissão</label>
                <input type="list" name="prof" id="prof"  list="iprof">
                <datalist id="iprof">
                    <option    >Desenvolvedor Web</option>
                    <option >Gestão de RH</option>
                    <option >Professor</option>
                    <option >Médico</option>
                </datalist>
            </p>



     <label for="mensagem">Comentários:</label> <br>
     <textarea name="msg" id="mensagem" cols="30" rows="20" maxlength="400" minlength="5" required > </textarea>
         <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
     </p>

     </form>


</body>
</html>
