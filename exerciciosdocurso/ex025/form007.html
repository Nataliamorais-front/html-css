<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.php" method="post">
        <label for="cor">Cores:</label>
        <input type="color" name="col" id="cor" value="#00ff00" >

        <p>
            <label for="nivel">
                Nivel de Satisfação:
            </label>
            <input type="range" name="Nivel" id="nivel" min="1" max="5" value="1">
        </p>

        <p>
            <label for="arquivo">
                Anexo Curriculo:
            </label>
            <p><input type="file" name="arquivo" id="arquivo" accept=".pdf, .docx"></p>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        
    </form>
</body>
</html>
