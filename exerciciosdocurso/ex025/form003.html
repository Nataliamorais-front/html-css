<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>

    </style>

</head>
<body>
    <h3>Aprendendo a colocar números, data, no forumário.</h3>
    <form action="cadastro.php" autocomplete="on" method="get" >

            <p >
                <label for="nome_">Nome:</label>
                <input type="text" name="nome" id="nome_" required maxlength="30" autocomplete="name" placeholder="nome completo"   >
            </p>
            <p >
                <label for="media_">Média:</label>
                <input type="number" name="media" id="media_" min="0" max="10" step="0.1" value="5"
                placeholder="0 a 10">
            </p>

        <p>
            <label for="mes_">Mês:</label>
            <input type="month" name="mes" id="mes_" value="2025-01">
        </p>
        <p>
            <label for="date_">Data de Nascimento:</label>
            <input type="date" name="date" id="date_" value="2025-09-21">
        </p>
        <p>
            <label for="time_">Hora:</label>
            <input type="time" name="time" id="time_" >
        </p>

        <p>
            <input type="submit" value="Enviar">
            
        </p>
       





        



    </form>

</body>
</html>
