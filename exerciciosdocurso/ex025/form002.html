<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário com usuário e senha</title>

</head>
<body>
    <form action="cadastro.php" method="get" autocomplete="on">
        <div>
            <p><label for="iusu">Usuário:</label>
                <input type="text" name="usuário" id="iusu"  required minlength="5" maxlength="20" size="8" placeholder="nome do usuário" autocomplete="username">
                
            </p>
        </div>
        <div>
            <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" required minlength="8" size="8" autocomplete="current-password">
            </p>
        </div>
        <div>
            <p>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
            </p>
        </div>




    </form>
</body>
</html>
